name: Deploy privacy policy to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/privacy-policy/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # docs/privacy-policy 만 사이트 루트의 /privacy-policy/ 로 게시한다.
      # 내부 설계 문서(prd, adr 등)는 공개되지 않는다.
      - name: Stage site
        run: |
          mkdir -p _site/privacy-policy
          cp docs/privacy-policy/index.html _site/privacy-policy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
